[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-manager"
version = "0.1.0"
description = "Local hub + pixel-art office and TUI to watch and approve actions of AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "pyyaml>=6",
  "httpx>=0.27",
  "rich>=13.7",
]

[tool.setuptools]
packages = ["agent_manager"]
